services:
  # 1. Express API Backend + pg-boss Worker Queue
  - type: web
    name: university-exam-api
    env: node
    rootDir: api
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: university-exam-db
          property: connectionString

  # 2. React Web Dashboard Frontend
  - type: web
    name: university-exam-web
    env: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: university-exam-api
          property: url
          suffix: /api

databases:
  # 3. PostgreSQL Database Service
  - name: university-exam-db
    databaseName: university_exam
    user: postgres
    plan: free

version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: university-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: university_exam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: university-api
    depends_on:
      - db
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/university_exam?schema=public
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

volumes:
  pgdata:
